<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .contact {

            width: 500px;

            margin: 50px auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, .1);

        }

        .contact h1 {

            text-align: center;

            margin-bottom: 20px;

            color: #ff6600;

        }

        .contact input,
        .contact textarea {

            width: 100%;

            padding: 12px;

            margin: 10px 0;

            border: 1px solid #ccc;

            border-radius: 5px;

        }

        .contact button {

            width: 100%;

            padding: 15px;

            background: #ff6600;

            color: white;

            border: none;

            border-radius: 5px;

            font-size: 18px;

            cursor: pointer;

        }

        .contact button:hover {

            background: #e65c00;

        }

        .info {

            text-align: center;

            margin-top: 25px;

            line-height: 30px;

        }
    </style>

</head>

<body>

    <header>

        <div class="logo">🍕 FoodieHub</div>

        <nav>

            <ul>

                <li><a href="index.html">Home</a></li>

                <li><a href="menu.html">Menu</a></li>

                <li><a href="about.html">About</a></li>

                <li><a href="contact.html" class="active">Contact</a></li>

            </ul>

        </nav>

    </header>

    <div class="contact">

        <h1>Contact Us</h1>

        <form>

            <input type="text" placeholder="Your Name" required>

            <input type="email" placeholder="Email Address" required>

            <textarea rows="5" placeholder="Your Message"></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

        <div class="info">

            <h3>📍 Address</h3>

            <p>Ghaziabad, Uttar Pradesh</p>

            <h3>📞 Phone</h3>

            <p>+91 9876543210</p>

            <h3>✉ Email</h3>

            <p>foodiehub@gmail.com</p>

        </div>

    </div>

    <footer>

        <p>© 2026 FoodieHub</p>

    </footer>

</body>

</html>
